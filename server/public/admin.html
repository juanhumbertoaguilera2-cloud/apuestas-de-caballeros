<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuestas de Caballeros — Administración</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand">Administración</div>
    <div class="tagline">Apuestas de Caballeros</div>
    <div id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <input id="loginUser" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="loginPass" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">Entrar</button>
    </form>
    <p class="helptext" style="margin-top:18px;"><a href="index.html" style="color:var(--gold);">← Volver a la app</a></p>
  </div>
</div>

<div id="appView" style="display:none;">
  <header class="club-header">
    <div class="brand">Apuestas de Caballeros<small>administración</small></div>
    <div class="header-right">
      <div class="avatar-circle">👤</div>
      <span id="whoami"></span>
      <span class="badge-role">Admin</span>
      <button class="btn btn-danger btn-sm" id="logoutBtn">Cerrar sesión</button>
    </div>
  </header>

  <div class="container">
    <h3 class="section-title">Mi cuenta</h3>
    <div class="card">
      <div id="myAccountError"></div>
      <div id="myAccountSuccess"></div>
      <form id="myAccountForm">
        <div class="form-group">
          <label>Nuevo usuario (déjalo igual si no lo quieres cambiar)</label>
          <input id="ma-user" required>
        </div>
        <div class="form-group">
          <label>Nueva contraseña (déjala en blanco si no la quieres cambiar)</label>
          <input id="ma-newpass" type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Tu contraseña actual (para confirmar el cambio)</label>
          <input id="ma-currentpass" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
      </form>
    </div>

    <h3 class="section-title">Dar de alta usuario</h3>
    <div class="card">
      <div id="createUserError"></div>
      <div id="createUserSuccess"></div>
      <form id="createUserForm">
        <div class="form-group"><label>Usuario</label><input id="nu-user"></div>
        <div class="form-group"><label>Contraseña (mínimo 4 caracteres)</label><input id="nu-pass" type="password"></div>
        <div class="form-group">
          <label>Rol</label>
          <select id="nu-role"><option value="user">Usuario</option><option value="admin">Administrador</option></select>
        </div>
        <button class="btn btn-primary" type="submit">Dar de alta</button>
      </form>
    </div>

    <h3 class="section-title">Usuarios</h3>
    <div style="overflow-x:auto;"><table id="usersTable"><thead><tr><th>Usuario</th><th>Rol</th></tr></thead><tbody></tbody></table></div>

    <h3 class="section-title">Todas las apuestas registradas</h3>
    <div style="overflow-x:auto;"><table id="offersTable"><thead><tr><th>Ticket</th><th>Descripción</th><th>Creador</th><th>Monto</th><th>Cupo</th><th>Estado</th></tr></thead><tbody></tbody></table></div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
